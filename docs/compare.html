<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuji Home: before and after</title>
<link rel="icon" href="logo.svg">
<style>
  :root { --bg: #f6f4f1; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --text: #f5f5f7; --muted: #a1a1a6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 16px 56px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  header img { width: 48px; height: 48px; }
  h1 { font-size: 28px; margin: 0; }
  p { color: var(--muted); margin: 0 0 24px; }
  .compare { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
             box-shadow: 0 20px 50px rgba(0,0,0,.25); user-select: none; touch-action: none; cursor: ew-resize; }
  .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .after { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; margin-left: -1.5px; background: #fff; }
  .knob { position: absolute; top: 50%; left: var(--pos); width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
          background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); display: grid; place-items: center; color: #333; font-size: 18px; }
  .tag { position: absolute; bottom: 14px; padding: 5px 14px; border-radius: 20px; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; }
  .tag.a { left: 14px; } .tag.b { right: 14px; }
  input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .note { margin-top: 16px; font-size: 14px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <header><img src="logo.svg" alt=""><h1>Fuji Home</h1></header>
  <p>Drag the handle to compare. Before: a typical stock Android TV home screen, recreated. After: Fuji Home on my TV.</p>

  <div class="compare" id="compare" style="--pos: 50%">
    <img src="before.jpg" alt="Before: a stock Android TV home screen with a sponsored banner and recommendation rows">
    <img class="after" src="home.jpg" alt="After: Fuji Home with Mount Fuji, a big clock, Keep watching and the app dock">
    <div class="line"></div>
    <div class="knob" aria-hidden="true">&#8596;</div>
    <span class="tag a">After</span>
    <span class="tag b">Before</span>
    <input type="range" min="0" max="100" value="50" step="0.1" aria-label="Compare before and after" id="slider">
  </div>

  <p class="note"><a href="https://github.com/PRODHOSH/fuji-home">Back to Fuji Home on GitHub</a></p>
</main>
<script>
  const box = document.getElementById('compare');
  const slider = document.getElementById('slider');
  const set = v => box.style.setProperty('--pos', v + '%');
  slider.addEventListener('input', () => set(slider.value));
</script>
</body>
</html>
